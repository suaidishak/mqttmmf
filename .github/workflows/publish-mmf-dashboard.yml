name: Publish MMF dashboard

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'mmf-dashboard/**'
      - 'pythonanywhere-mmf/export_dashboard.py'
      - 'pythonanywhere-mmf/test_dashboard_export.py'
      - '.github/workflows/publish-mmf-dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mmf-dashboard-pages
  cancel-in-progress: false

jobs:
  publish:
    if: vars.MMF_DASHBOARD_PUBLIC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install exporter dependencies
        run: python -m pip install -r pythonanywhere-mmf/requirements.txt
      - name: Verify exporter and dashboard logic
        run: |
          python -m unittest discover -s pythonanywhere-mmf -v
          node --test mmf-dashboard/model.test.mjs
          node --check mmf-dashboard/app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare static website
        shell: bash
        run: |
          mkdir -p _site/data
          cp mmf-dashboard/index.html mmf-dashboard/app.js mmf-dashboard/model.mjs mmf-dashboard/style.css mmf-dashboard/tokens.css mmf-dashboard/icon.svg _site/
      - name: Export approved calculated averages
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MMF_SITE_CODE: ${{ vars.MMF_SITE_CODE || 'LSS-BIDOR' }}
          MMF_DASHBOARD_PUBLIC_ENABLED: ${{ vars.MMF_DASHBOARD_PUBLIC_ENABLED }}
        run: python pythonanywhere-mmf/export_dashboard.py --output _site/data/averages.json
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
