name: MQTT MMF to PythonAnywhere

on:
  schedule:
    # UTC; offset from the busy start of each hour. Delivery times may vary.
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      probe_only:
        description: 'Check station coverage without uploading a file'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mqtt-mmf-pythonanywhere
  cancel-in-progress: false

jobs:
  collect:
    # Scheduling stays off until setup and manual verification are complete.
    if: github.event_name == 'workflow_dispatch' || vars.MMF_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out collector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install -r pythonanywhere-mmf/requirements.txt
      - name: Run synthetic tests
        run: python -m unittest discover -s pythonanywhere-mmf -v
      - name: Collect MMF station messages
        env:
          MQTT_HOST: ${{ secrets.MQTT_HOST }}
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          MQTT_PORT: ${{ vars.MQTT_PORT || '1883' }}
          MQTT_TLS: ${{ vars.MQTT_TLS || 'false' }}
          MQTT_TOPIC_ROOT: ${{ vars.MQTT_TOPIC_ROOT || 'BDNS' }}
          MMF_SITE_CODE: ${{ vars.MMF_SITE_CODE || 'LSS-BIDOR' }}
          PYTHONANYWHERE_REMOTE_FILE: ${{ vars.PYTHONANYWHERE_REMOTE_FILE }}
          PROBE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_only }}
        shell: bash
        run: |
          args=(--from-env --once --collection-seconds 180)
          if [[ "$PROBE_ONLY" == "true" ]]; then
            args+=(--no-upload)
          fi
          python pythonanywhere-mmf/collector.py "${args[@]}"
